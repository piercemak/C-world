name: Publish CWorld Catalyst update

on:
  push:
    branches:
      - main
    paths:
      - "ios/CWorldIOS/**"
      - "ios/LocalMac/**"
      - "ios/scripts/package-local-mac.sh"
      - "ios/scripts/prepare-sparkle.sh"
      - "ios/scripts/publish-mac-update.mjs"
      - "CWorldIOS/CWorldMacLocal.entitlements"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version; leave blank to increment the latest Mac version"
        required: false
        type: string
      build:
        description: "Build number; leave blank to use the workflow run number"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cworld-catalyst-release
  cancel-in-progress: false

jobs:
  publish-catalyst:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select release metadata
        id: metadata
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            git fetch --tags --force
            version="$(node <<'NODE'
          const { execFileSync } = require('child_process');
          const base = require('./ios/LocalMac/updates.json').version;
          const tags = execFileSync('git', ['tag', '--list', 'mac-v*'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean).map(tag => tag.slice(5))
            .filter(value => /^\d+\.\d+\.\d+$/.test(value))
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
          const current = tags.at(-1) || base;
          const [major, minor, patch] = current.split('.').map(Number);
          process.stdout.write(`${major}.${minor}.${patch + 1}`);
          NODE
            )"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          current_build="$(node -p "require('./ios/LocalMac/updates.json').build")"
          requested_build="${INPUT_BUILD:-$RUN_NUMBER}"
          build="$requested_build"
          if (( build <= current_build )); then
            build=$((current_build + 1))
          fi
          printf 'version=%s\nbuild=%s\n' "$version" "$build" >> "$GITHUB_OUTPUT"

      - name: Create automatic Mac release tag
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="mac-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${tag}"
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"

      - name: Create CI update configuration
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD: ${{ steps.metadata.outputs.build }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const base = require('./ios/LocalMac/updates.json');
          base.version = process.env.VERSION;
          base.build = Number(process.env.BUILD);
          fs.writeFileSync('/tmp/cworld-updates.json', JSON.stringify(base, null, 2) + '\n');
          NODE

      - name: Build Catalyst DMG
        env:
          CWORLD_UPDATE_CONFIG: /tmp/cworld-updates.json
        run: |
          bash ios/scripts/package-local-mac.sh "$GITHUB_WORKSPACE/dist/catalyst"

      - name: Publish signed Sparkle update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_KEY: ${{ secrets.CWORLD_SPARKLE_ED_KEY }}
        run: |
          set -euo pipefail
          dmg="$(find "$GITHUB_WORKSPACE/dist/catalyst" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "Catalyst DMG was not produced" >&2
            exit 1
          fi
          node ios/scripts/publish-mac-update.mjs "$dmg" --publish
