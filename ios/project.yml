name: CWorldIOS
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  CWorldIOS:
    type: application
    platform: iOS
    sources:
      - path: Shared/CWorldWatchingAttributes.swift
      - path: CWorldIOS
        excludes:
          - Resources/MobileArtwork
          - Resources/DesktopArtwork
      - path: ../frontend/src/data/episodeTitles.json
        buildPhase: resources
      - path: CWorldIOS/Resources/MobileArtwork
        type: folder
        buildPhase: resources
      - path: CWorldIOS/Resources/DesktopArtwork
        type: folder
        buildPhase: resources
        platformFilters: [maccatalyst]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cearaworld.cworld
        PRODUCT_NAME: CWorld
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../CWorldIOS/Info.plist
        SUPPORTS_MACCATALYST: YES
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]": com.cearaworld.cworld.mac
        "TARGETED_DEVICE_FAMILY[sdk=macosx*]": "6"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ../CWorldIOS/CWorldMac.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": ../CWorldIOS/CWorldWatching.entitlements
        "INFOPLIST_KEY_LSApplicationCategoryType[sdk=macosx*]": public.app-category.entertainment
        INFOPLIST_KEY_CFBundleDisplayName: CearaWorld
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: CWorldWatchingWidget
        platformFilters: [ios]
  CWorldWatchingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CWorldWatchingWidget
        excludes: [Info.plist]
      - path: Shared/CWorldWatchingAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cearaworld.cworld.watching
        CODE_SIGN_ENTITLEMENTS: ../CWorldIOS/CWorldWatching.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CWORLD_WIDGET_EXTENSION"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CWorldWatchingWidget/Info.plist
        SUPPORTS_MACCATALYST: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
